name: security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deep_gitleaks:
        description: "Scan full git history with gitleaks (slower)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  security:
    uses: amcaughan-personal/shared-workflows/.github/workflows/security-scan.yml@299c2f6e41e4dec27a67978c68e1798981914041 # v1.0.1
    permissions:
      contents: read
      pull-requests: write
    with:
      scan_git_history: ${{ github.event_name == 'pull_request' || inputs.deep_gitleaks }}
