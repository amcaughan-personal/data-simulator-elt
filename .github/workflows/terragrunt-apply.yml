name: terragrunt-apply

# Applies infrastructure from main: dev, then prod, which waits for approval in the
# infra-production environment. The dev job also plans prod, so the run's summary shows what
# prod will do before it's approved. A stack that would destroy or replace anything stops
# the run and is applied locally. Output stays on the runner (this repo is public); the
# run's summary lists the changes by address and type.

on:
  # Paused while this project's AWS resources are torn down (see the README): runs only when
  # started by hand. Reverting the pause PR restores the automatic triggers.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev:
    uses: amcaughan-personal/shared-workflows/.github/workflows/terragrunt-apply.yml@f0f0d6e584ed0188191247c0e608893c9b12fe04 # v2.3.1
    permissions:
      contents: read
      id-token: write # to sign in to AWS as the apply role
    with:
      terragrunt_working_dir: infra/terragrunt/live/dev
      environment: infra-dev
      aws_region: us-east-2
      report_title: "Terragrunt apply: dev"
      # Plan prod read-only after dev applies, so its plan is in this run's summary when
      # the prod job asks for approval.
      preview_terragrunt_working_dir: infra/terragrunt/live/prod
      preview_title: "Prod plan (applies after approval)"
    secrets:
      aws_role_arn: ${{ secrets.APPLY_ROLE_ARN }}

  prod:
    needs: dev
    uses: amcaughan-personal/shared-workflows/.github/workflows/terragrunt-apply.yml@f0f0d6e584ed0188191247c0e608893c9b12fe04 # v2.3.1
    permissions:
      contents: read
      id-token: write
    with:
      terragrunt_working_dir: infra/terragrunt/live/prod
      environment: infra-production
      aws_region: us-east-2
      report_title: "Terragrunt apply: prod"
    secrets:
      aws_role_arn: ${{ secrets.APPLY_ROLE_ARN }}
