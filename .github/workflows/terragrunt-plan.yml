name: terragrunt-plan

# Plans every Terragrunt stack on pull requests that touch infrastructure, and comments
# the changes (addresses and types only; this repo is public). terragrunt-apply applies
# them after merging.

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "src/ingest/sources/**" # each source file defines a Glue table and a schedule
      - ".tool-versions"
      - ".github/workflows/terragrunt-plan.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terragrunt-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    uses: amcaughan-personal/shared-workflows/.github/workflows/terragrunt-plan.yml@584cb6fd815044315b6f9b74e607a02c065801d4 # v2.1.1
    with:
      aws_region: us-east-2
    secrets:
      aws_role_arn: ${{ secrets.PLAN_ROLE_ARN }}
