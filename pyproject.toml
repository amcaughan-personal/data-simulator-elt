[project]
name = "data-simulator-elt"
version = "0.1.0"
description = "Pulls the data-simulator API's payments data into S3, hour by hour, for querying with Athena."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
# boto3 is provided by the Lambda runtime, so it's only a dev dependency here.
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.40",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.uv]
# Never resolve to a package version published in the last week.
exclude-newer = "1 week"
